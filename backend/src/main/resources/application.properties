# --- Local development database (H2, file-based so data survives restarts) ---
# Swapping this file for an application-azure.properties later (with a
# spring.profiles.active=azure flag) is exactly how "Spring profiles for
# local vs cloud config" from the resume plan gets implemented - a real,
# common pattern worth learning here rather than hardcoding one environment.
spring.datasource.url=jdbc:h2:file:./data/hebrewdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update: Hibernate creates/updates tables from our @Entity classes
# automatically on startup. Fine for local dev and this project's scale;
# a real production system would use versioned migrations (Flyway/Liquibase)
# instead of letting Hibernate auto-alter the schema - worth knowing that's
# the "grown-up" version of this setting, even though update is fine here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2's web console, handy for poking at the data directly in a browser
# during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
